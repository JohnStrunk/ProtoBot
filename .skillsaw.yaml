---
version: "0.21.0"
# This list extends content-* rules to extra files; it does not
# restrict which files the skillsaw pre-commit hook scans. The hook
# lints the whole repository (pass_filenames: false by default).
# .skillsaw-baseline.json — not content-paths — is the source of
# truth for whether a given file or pattern is already exempted
# from a rule.
content-paths:
  - "docs/vision.md"
  - "docs/architecture.md"
strict: true
fail-on: info
exclude:
  - ".worktrees/**"
rules:
  context-budget:
    # AGENTS.md is injected into every dispatched agent's prompt.
    # Keep the agents-md warn limit at or below the current size so
    # context-budget always emits a finding; .skillsaw-baseline.json
    # then ratchets that finding (ceiling mode) and rejects token
    # growth. Consolidate existing rules or move instructions into
    # on-demand skills before adding prose. After a successful
    # shrink, run `skillsaw baseline` to lower the ceiling.
    limits:
      agents-md:
        warn: 4000
