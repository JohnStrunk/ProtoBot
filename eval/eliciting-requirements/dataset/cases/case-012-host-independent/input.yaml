  Host metadata:
  id: BILL-REQ-42
  tags: [billing, external-api]
  trace: interface://billing/v2/charge

  Existing requirement:
  When the Billing API receives a charge request at the service boundary with
  a positive decimal amount no greater than 10,000 USD-equivalent and a
  currency in the supported set [USD, EUR, GBP], the Billing API shall return
  exactly one decision field with the value approved, declined, or
  indeterminate within a maximum of 500 ms measured from complete request
  receipt to response emission. This timing applies to every request under a
  load of up to 100 concurrent requests. Invalid amounts and unsupported
  currencies are outside this requirement.
